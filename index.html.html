<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리눅스마스터 2급 1차 · 실전모의고사</title>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--tx:#222;--mu:#777;--ln:#e2e2de;--ac:#2f5aa8;--acs:#eaf0fb;--ok:#2e7d4f;--bad:#c0392b;--warn:#b7791f;--warnbg:#fdf6e3;--r:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1c1e;--sf:#25272a;--tx:#eee;--mu:#999;--ln:#3a3d41;--ac:#7aa3ea;--acs:#2a3345;--warnbg:#3a3220}}
:root[data-theme="dark"]{--bg:#1b1c1e;--sf:#25272a;--tx:#eee;--mu:#999;--ln:#3a3d41;--ac:#7aa3ea;--acs:#2a3345;--warnbg:#3a3220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;min-height:100vh}
header{background:var(--sf);border-bottom:1px solid var(--ln);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.layout{display:flex;max-width:1080px;margin:0 auto}
aside{width:250px;flex:none;padding:16px;border-right:1px solid var(--ln);min-height:calc(100vh - 56px)}
main{flex:1;padding:20px;min-width:0}
@media (max-width:760px){.layout{flex-direction:column}aside{width:auto;border-right:none;border-bottom:1px solid var(--ln)}}
.side-btn{display:block;width:100%;text-align:left;border:1px dashed var(--ln);background:var(--sf);color:var(--tx);padding:9px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px}
.side-btn.on{border:1px solid var(--ac);background:var(--acs)}
.side-title{font-size:12px;color:var(--mu);margin:14px 0 6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--mu);font-size:14px}
.btn{border:none;background:var(--ac);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{background:var(--ln);color:var(--mu);cursor:not-allowed}
.opt{display:block;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt input{margin-right:8px}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.right{border-color:var(--ok);background:#e7f5ec;color:#222}
.opt.wrong{border-color:var(--bad);background:#fbeceb;color:#222}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.bar div{height:100%;background:var(--ac)}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.qtext{white-space:pre-wrap;margin:6px 0 4px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-right:6px;border:1px solid}
.tag.중복{color:var(--bad);border-color:var(--bad)}
.tag.유사{color:var(--ac);border-color:var(--ac)}
.tag.애매{color:var(--warn);border-color:var(--warn)}
.tag.정정{color:var(--ok);border-color:var(--ok)}
.note{background:var(--warnbg);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;color:var(--tx)}
.note p{margin:4px 0}
footer{color:var(--mu);font-size:12px;text-align:center;padding:24px 10px}
.legend .tag{margin-bottom:4px}
</style>
</head>
<body>
<header>
  <h1>리눅스마스터 2급 1차 · 실전모의고사</h1>
  <span class="muted">50문항 · 100점 만점(문항당 2점) · 60점 이상 합격</span>
</header>
<div class="layout">
  <aside>
    <div class="side-title">회차</div>
    <div id="side"></div>
    <div class="side-title">표시 안내</div>
    <div class="legend muted" style="font-size:12px">
      <div><span class="tag 중복">중복</span>동일한 문항이 PDF에 또 있음</div>
      <div><span class="tag 유사">유사</span>같은 개념을 다른 문장으로 묻는 문항</div>
      <div><span class="tag 애매">애매</span>정답이 명확하지 않거나 지문이 불완전함</div>
      <div><span class="tag 정정">정정</span>자료 수정으로 정답이 바뀐 문항</div>
    </div>
    <div class="side-title" style="margin-top:18px">데이터</div>
    <div class="muted" style="font-size:12px" id="stat"></div>
  </aside>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <section id="view"></section>
    <footer>비공식 개인 정리 자료 · 원문: 리눅스마스터 2급 1차 족보(카페) 2개 파일 · 실제 시험과 다를 수 있습니다</footer>
  </main>
</div>

const ITEMS = {}; DATA.items.forEach(i => ITEMS[i.id] = i);
const SETS = DATA.sets;
const KEY = "lm2-mock-v2";
const PASS = 60, POINT = 2, LABELS = ["①","②","③","④"];

let st = {results:{}, wrongs:[]};
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }

let tab = "mock", cur = null, side = null;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tags(item){
  return item.tags.map(t => `<span class="tag ${t}">${t}</span>`).join("");
}
function notes(item){
  if (!item.notes.length) return "";
  return `<div class="note">${item.notes.map(n => `<p>· ${esc(n)}</p>`).join("")}</div>`;
}
function idLabel(id){ return id; }
function qNo(id){ return `${id}번`; }
function setById(n){ return SETS.find(s => s.no === n); }
function wrongList(){ return st.wrongs; }

function render(){
  const tabs = [["mock","실전모의고사"],["all","기출 전체"],["wrong","오답노트 " + st.wrongs.length]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,l]) =>
    `<button class="tab ${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  document.getElementById("side").innerHTML = SETS.map(s => {
    const r = st.results[s.no];
    const sub = r ? `${r.score}점 · ${r.score>=PASS?"합격":"불합격"}` : "아직 풀지 않음";
    return `<button class="side-btn ${side===s.no?"on":""}" onclick="pickSide(${s.no})"><b>${s.no}회차</b><div class="muted" style="font-size:12px">${sub}</div></button>`;
  }).join("");
  document.getElementById("stat").innerHTML = `전체 ${DATA.items.length}문항 · 태그 ${DATA.items.filter(i=>i.tags.length).length}문항`;
  const v = document.getElementById("view");
  if (tab === "mock") v.innerHTML = cur ? (cur.done ? resultHTML() : quizHTML()) : mockListHTML();
  else if (tab === "all") v.innerHTML = allHTML();
  else v.innerHTML = wrongHTML();
}
function go(t){ tab = t; cur = null; render(); window.scrollTo(0,0); }
function pickSide(n){ side = n; tab = "mock"; cur = null; render(); }

function mockListHTML(){
  return `<div class="card muted">각 회차는 50문항입니다. 문항 수가 188개로 한정되어 있어 4·5회차에는 이전 회차와 겹치는 문항이 포함됩니다.</div>` +
  SETS.map(s => {
    const r = st.results[s.no];
    const overlap = s.no > 1 ? s.ids.filter(id => SETS.slice(0, s.no-1).some(p => p.ids.includes(id))).length : 0;
    const info = overlap ? `<div class="muted" style="font-size:12px">이전 회차와 겹치는 문항 ${overlap}개</div>` : "";
    const status = r ? `${r.score}점 <span class="${r.score>=PASS?"pass":"fail"}">${r.score>=PASS?"합격":"불합격"}</span> · ${r.date}`
                     : `<span class="muted">아직 풀지 않았어요</span>`;
    const btn = r ? `<button class="btn ghost" onclick="viewResult(${s.no})">결과 보기</button> <button class="btn" onclick="start(${s.no})">다시 풀기</button>`
                  : `<button class="btn" onclick="start(${s.no})">시작하기</button>`;
    return `<div class="card row"><div><b>${s.no}회차</b> · 50문항<div>${status}</div>${info}</div><div>${btn}</div></div>`;
  }).join("");
}

function start(n){
  const s = setById(n);
  cur = {n, ids: s.ids, idx: 0, answers: Array(50).fill(null), done: false};
  tab = "mock"; render(); window.scrollTo(0,0);
}

function quizHTML(){
  const {n, ids, idx, answers} = cur, item = ITEMS[ids[idx]];
  const pct = Math.round(idx/50*100);
  return `<div class="row"><b>${n}회차 · ${idx+1} / 50</b><button class="btn ghost" onclick="go('mock')">나가기</button></div>
  <div class="bar"><div style="width:${pct}%"></div></div>
  <div class="card">
    <div>${tags(item)}<span class="muted" style="font-size:13px">원문 ${qNo(item.id)}</span></div>
    ${notes(item)}
    <div class="qtext"><b>${idx+1}.</b> ${esc(item.q)}</div>
    ${item.o.map((o,i)=>`<label class="opt ${answers[idx]===i?"sel":""}"><input type="radio" name="o" ${answers[idx]===i?"checked":""} onchange="pick(${i})">${LABELS[i]} ${esc(o)}</label>`).join("")}
  </div>
  <div class="row">
    <button class="btn ghost" onclick="move(-1)" ${idx===0?"disabled":""}>이전</button>
    ${idx < 49 ? `<button class="btn" onclick="move(1)">다음</button>` : `<button class="btn" onclick="submit()">답안 제출</button>`}
  </div>
  <p class="muted" style="margin-top:12px">답안 선택 ${answers.filter(a=>a!==null).length} / 50</p>`;
}
function pick(i){ cur.answers[cur.idx] = i; render(); }
function move(d){ cur.idx += d; render(); window.scrollTo(0,0); }

function isCorrect(item, ans){ return ans !== null && item.a.includes(ans); }

function submit(){
  const unanswered = cur.answers.filter(a => a===null).length;
  if (unanswered && !confirm(`아직 ${unanswered}문항을 풀지 않았습니다. 제출할까요?`)) return;
  let correct = 0; const wrong = [];
  cur.ids.forEach((id, i) => { if (isCorrect(ITEMS[id], cur.answers[i])) correct++; else wrong.push(id); });
  const score = correct * POINT;
  st.results[cur.n] = {score, correct, ids: cur.ids, answers: cur.answers, date: new Date().toLocaleDateString("ko-KR")};
  wrong.forEach(id => { if (!st.wrongs.includes(id)) st.wrongs.push(id); });
  save();
  cur.done = true; render(); window.scrollTo(0,0);
}

function viewResult(n){
  const r = st.results[n];
  cur = {n, ids: r.ids, idx: 0, answers: r.answers, done: true}; tab = "mock"; render();
}

function resultHTML(){
  const {n, ids, answers} = cur;
  const correct = ids.filter((id,i) => isCorrect(ITEMS[id], answers[i])).length;
  const score = correct * POINT, pass = score >= PASS;
  return `<div class="card" style="text-align:center">
    <div class="muted">${n}회차 결과</div>
    <div style="font-size:40px;font-weight:700">${score}점</div>
    <div class="${pass?"pass":"fail"}">${pass?"합격":"불합격"} (60점 이상 합격)</div>
    <div class="muted">50문항 중 ${correct}문항 정답</div>
  </div>
  ${ids.map((id,i) => { const item = ITEMS[id]; return `<div class="card">
    <div>${tags(item)}<span class="muted" style="font-size:13px">${qNo(id)}</span></div>
    ${notes(item)}
    <div class="qtext"><b>${i+1}.</b> ${esc(item.q)}</div>
    ${item.o.map((o,j)=>{ const ok = item.a.includes(j); const mine = answers[i]===j;
      return `<div class="opt ${ok?"right":(mine?"wrong":"")}">${LABELS[j]} ${esc(o)}${ok?" ✔ 정답":""}${mine&&!ok?" (내 답)":""}</div>`; }).join("")}
  </div>`; }).join("")}
  <div class="row"><button class="btn ghost" onclick="go('mock')">목록으로</button></div>`;
}

function allHTML(){
  return `<div class="muted" style="margin-bottom:10px">PDF 기출 전체 ${DATA.items.length}문항 (정답 표시 포함)</div>` +
  DATA.items.map(item => `<div class="card">
    <div>${tags(item)}<span class="muted" style="font-size:13px">${qNo(item.id)}</span></div>
    ${notes(item)}
    <div class="qtext">${esc(item.q)}</div>
    ${item.o.map((o,j)=>`<div class="opt ${item.a.includes(j)?"right":""}">${LABELS[j]} ${esc(o)}</div>`).join("")}
  </div>`).join("");
}

function wrongHTML(){
  if (!st.wrongs.length) return `<div class="card muted">아직 틀린 문제가 없습니다. 실전모의고사를 풀면 여기에 쌓입니다.</div>`;
  return `<div class="row" style="margin-bottom:10px"><span class="muted">총 ${st.wrongs.length}문항</span>
    <button class="btn ghost" onclick="clearWrong()">오답 비우기</button></div>` +
  st.wrongs.map(id => { const item = ITEMS[id];
    return `<div class="card"><div>${tags(item)}<span class="muted" style="font-size:13px">${qNo(id)}</span></div>${notes(item)}
    <div class="qtext">${esc(item.q)}</div>
    ${item.o.map((o,j)=>`<div class="opt ${item.a.includes(j)?"right":""}">${LABELS[j]} ${esc(o)}${item.a.includes(j)?" ✔ 정답":""}</div>`).join("")}</div>`; }).join("");
}
function clearWrong(){ if (confirm("오답노트를 비울까요?")) { st.wrongs = []; save(); render(); } }

render();
</script>
